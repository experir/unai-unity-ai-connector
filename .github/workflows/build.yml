name: Validate player builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player:
    if: vars.UNITY_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modules: [core, full]
        target: [StandaloneWindows64, WebGL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python Tools~/prepare_unity_project.py UnityValidation --modules ${{ matrix.modules }} --samples
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityValidation
          unityVersion: '6000.3.23f1'
          targetPlatform: ${{ matrix.target }}
          buildMethod: UnaiValidationBuild.Build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-${{ matrix.modules }}-${{ matrix.target }}
          path: UnityValidation/Builds
